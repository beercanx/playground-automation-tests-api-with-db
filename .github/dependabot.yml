# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-github-actions:
        patterns:
          - "*"

  # Maintain dependencies in Maven 
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "maven"
      - "dependencies"
    groups:
      security-updates-maven-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
      version-updates-maven-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
